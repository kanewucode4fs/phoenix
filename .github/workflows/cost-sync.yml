name: Sync Model Pricing Data

on:
  schedule:
    # 工作日北京时间 21:00 同步价格。
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-model-pricing
  cancel-in-progress: false

env:
  MANIFEST_PATH: src/phoenix/server/cost_tracking/model_cost_manifest.json

jobs:
  sync-model-pricing:
    name: Sync Model Pricing Data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          resolution-strategy: "lowest"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步模型价格
        run: make sync-models

      - name: 检查价格变化
        id: prices
        run: |
          if git diff --quiet -- "$MANIFEST_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 验证更新后的价格表
        if: steps.prices.outputs.changed == 'true'
        run: |
          uv run --frozen pytest -q tests/unit/server/cost_tracking/test_model_cost_manifest.py
          git diff --check -- "$MANIFEST_PATH"

      - name: 创建或更新价格同步 PR
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          commit-message: "fix: 更新内置模型价格表"
          title: "fix: 更新内置模型价格表"
          body: |
            从 LiteLLM 同步内置模型价格表。

            已通过价格表回归测试与差异空白检查，请审核价格变化后合并。

            执行记录：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          add-paths: ${{ env.MANIFEST_PATH }}
          branch: automation/sync-model-catalog
          base: main
          delete-branch: true
